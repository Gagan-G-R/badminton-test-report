<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Badminton reports</title>
<style>
:root { --bg: #f4f6f2; --panel: #fff; --ink: #14201a; --ink-2: #4c5a52; --rule: #d6ddd6;
  --accent: #2f6b4f; color-scheme: light; }
@media (prefers-color-scheme: dark) { :root { --bg: #0f1612; --panel: #17211b; --ink: #e8efe9;
  --ink-2: #a5b3aa; --rule: #2a372f; --accent: #6fb592; color-scheme: dark; } }
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink);
  font: 17px/1.5 -apple-system, "Segoe UI", Roboto, sans-serif; }
main { max-width: 680px; margin: 0 auto; padding: 32px 16px 56px; display: grid; gap: 22px; }
h1 { margin: 0; font-size: 32px; line-height: 1.1; }
p { margin: 0; color: var(--ink-2); }
.pick { display: flex; flex-wrap: wrap; gap: 10px; }
select, button { font: inherit; padding: 8px 12px; border-radius: 8px;
  border: 1px solid var(--rule); background: var(--panel); color: var(--ink); }
select { flex: 1 1 240px; min-width: 0; }
button { background: var(--accent); color: var(--bg); border: 0; font-weight: 600;
  cursor: pointer; }
ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
li { background: var(--panel); border: 1px solid var(--rule); border-radius: 10px;
  padding: 12px 14px; display: grid; gap: 2px; min-width: 0; }
li a { color: var(--accent); font-weight: 600; }
.meta { font-size: 14px; color: var(--ink-2); }
code { font-size: 13px; color: var(--ink-2); overflow-wrap: anywhere; user-select: all; }
</style>
</head>
<body>
<main>
  <h1>Badminton reports</h1>
  <p>Pick a report. To share one, send its own link (shown under each report), not this page.</p>
  <div class="pick">
    <select id="report" aria-label="Report">
      <option value="reports/r0-4/">R0-4_UHD_60_game</option>
    </select>
    <button type="button" id="open">Open</button>
  </div>
  <ul>
    <li><a href="reports/r0-4/">R0-4_UHD_60_game</a><span class="meta">published 2026-11-14</span><code>https://gagan-g-r.github.io/badminton-test-report/reports/r0-4/</code></li>
  </ul>
</main>
<script>
document.getElementById("open").addEventListener("click", function () {
  location.href = document.getElementById("report").value;
});
</script>
</body>
</html>
